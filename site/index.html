<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060a08">
<title>servers // status</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a08; --panel: #0b120e; --line: #1c2e22;
    --green: #4dffa0; --green-dim: #1f6b46; --amber: #ffb703;
    --red: #ff6262; --text: #cdf5df; --muted: #729785;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% -15%, #102017, var(--bg) 54%); color: var(--text); font-family: 'Fragment Mono', monospace; }
  body::before { content: ''; position: fixed; inset: 0; z-index: 10; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0 2px, #0003 3px); }
  body::after { content: ''; position: fixed; inset: 0; z-index: 11; pointer-events: none; box-shadow: inset 0 0 150px 30px #000a; }
  .wrap { max-width: 1160px; margin: auto; padding: 42px 24px 70px; position: relative; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 36px; }
  h1, h2, .panel::before, .pill { font-family: Michroma, monospace; font-weight: 400; }
  h1 { margin: 0; font-size: clamp(21px, 3.4vw, 34px); letter-spacing: 2px; color: var(--green); text-shadow: 0 0 9px #4dffa080; }
  h1 span { color: var(--muted); }
  .intro { color: var(--muted); font-size: 11px; letter-spacing: 1.4px; margin: 12px 0 0; }
  .summary { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.9; }
  .summary strong { color: var(--green); font-weight: 400; }
  .machines { display: grid; gap: 32px; }
  .machine { border: 1px solid var(--line); background: linear-gradient(160deg, #0d1711d9, #080d0af0); padding: 24px; position: relative; }
  .machine::before, .machine::after { content: ''; position: absolute; width: 14px; height: 14px; border-color: var(--green-dim); }
  .machine::before { top: -1px; left: -1px; border-top: 1px solid; border-left: 1px solid; }
  .machine::after { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }
  .machine-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; flex-wrap: wrap; margin-bottom: 25px; }
  .machine-number { color: var(--green-dim); font-size: 11px; letter-spacing: 2px; margin-bottom: 7px; }
  h2 { margin: 0; color: var(--text); font-size: clamp(15px, 2.4vw, 21px); letter-spacing: 2px; }
  .seen { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .pill { border: 1px solid var(--green-dim); color: var(--green); padding: 7px 10px; border-radius: 3px; font-size: 10px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .dot { height: 7px; width: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 9px currentColor; }
  .machine.offline .pill { border-color: #612c2c; color: var(--red); }
  .machine.unknown .pill { border-color: #6a551d; color: var(--amber); }
  .machine.offline .grid { opacity: .5; }
  .machine.unknown .grid { opacity: .5; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .panel { min-height: 112px; border: 1px solid var(--line); background: #070c09; padding: 19px 16px 16px; position: relative; }
  .panel::before { content: attr(data-tag); position: absolute; top: -8px; left: 9px; background: #0a120d; padding: 0 6px; color: var(--muted); font-size: 9px; letter-spacing: 1px; }
  .value { color: var(--green); font-size: clamp(24px, 3vw, 32px); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .value.warn { color: var(--amber); } .value.crit { color: var(--red); }
  .sub { color: var(--muted); font-size: 11px; margin-top: 9px; overflow-wrap: anywhere; }
  .bar { height: 6px; background: #142019; margin-top: 11px; overflow: hidden; }
  .bar > div { width: 0; height: 100%; background: var(--green); transition: width .5s; }
  .bar.warn > div { background: var(--amber); } .bar.crit > div { background: var(--red); }
  .temps { grid-column: 1 / -1; min-height: 55px; }
  .temps ul { padding: 0; margin: 2px 0 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 18px; }
  .temps li { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
  .temp-label { color: var(--muted); overflow-wrap: anywhere; } .temp-value { color: var(--green); white-space: nowrap; }
  .temp-value.warn { color: var(--amber); } .temp-value.crit { color: var(--red); }
  .empty { color: var(--muted); font-size: 12px; border: 1px solid var(--line); padding: 20px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 11px; text-align: center; letter-spacing: 1px; }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .wrap { padding: 24px 14px 50px; } .machine { padding: 20px 14px; } .summary { text-align: left; } .grid { gap: 10px; } .panel { padding: 18px 11px 12px; } }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>//</span> SERVERS <span>::</span> STATUS</h1>
      <p class="intro">LIVE METRICS / LAST REPORT WINS</p>
    </div>
    <div class="summary"><div id="count">CONNECTING</div><div id="clock">--</div></div>
  </header>
  <main id="machines" class="machines" aria-live="polite"><p class="empty">Connecting to status service…</p></main>
  <footer id="footer">Reports arrive every minute. A machine is offline after 150 seconds without a report.</footer>
</div>
<template id="machine-template">
  <section class="machine">
    <div class="machine-head">
      <div><div class="machine-number"></div><h2></h2><div class="seen"></div></div>
      <div class="pill"><span class="dot"></span><span class="pill-text"></span></div>
    </div>
    <div class="grid">
      <div class="panel" data-tag="CPU"><div class="value cpu">--%</div><div class="bar cpu-bar"><div></div></div><div class="sub cpu-sub">--</div></div>
      <div class="panel" data-tag="MEMORY"><div class="value memory">--%</div><div class="bar memory-bar"><div></div></div><div class="sub memory-sub">--</div></div>
      <div class="panel" data-tag="DISK / "><div class="value disk">--%</div><div class="bar disk-bar"><div></div></div><div class="sub disk-sub">--</div></div>
      <div class="panel" data-tag="UPTIME"><div class="value uptime">--</div><div class="sub">SINCE BOOT</div></div>
      <div class="panel temps" data-tag="TEMPERATURES"><ul></ul></div>
    </div>
  </section>
</template>
<script>
const pollMs = 15000;
const bytes = (n) => {
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(1)} ${units[i]}`;
};
const uptime = (n) => `${Math.floor(n / 86400)}d ${Math.floor(n % 86400 / 3600)}h ${Math.floor(n % 3600 / 60)}m`;
const level = (n) => n >= 90 ? 'crit' : n >= 70 ? 'warn' : '';

function gauge(card, key, percent, detail) {
  const value = card.querySelector(`.${key}`);
  const bar = card.querySelector(`.${key}-bar`);
  const kind = level(percent);
  value.textContent = `${percent.toFixed(0)}%`;
  value.className = `value ${key} ${kind}`;
  bar.className = `bar ${key}-bar ${kind}`;
  bar.firstElementChild.style.width = `${Math.min(percent, 100)}%`;
  card.querySelector(`.${key}-sub`).textContent = detail;
}

function render(host, index) {
  const card = document.querySelector('#machine-template').content.firstElementChild.cloneNode(true);
  card.classList.toggle('offline', !host.online);
  card.querySelector('.machine-number').textContent = `NODE ${String(index + 1).padStart(2, '0')}`;
  card.querySelector('h2').textContent = host.name;
  card.querySelector('.pill-text').textContent = host.online ? 'ONLINE' : 'OFFLINE';
  card.querySelector('.seen').textContent = host.received_at
    ? `LAST REPORT ${new Date(host.received_at).toLocaleString()}` : 'NO REPORT YET';

  if (!host.metrics) return card;
  const data = host.metrics;
  gauge(card, 'cpu', data.cpu.percent, `${data.cpu.count} CORES · LOAD ${data.cpu.load_avg['1m'].toFixed(2)}`);
  gauge(card, 'memory', data.memory.percent, `${bytes(data.memory.used)} / ${bytes(data.memory.total)}`);
  gauge(card, 'disk', data.disk.percent, `${bytes(data.disk.used)} / ${bytes(data.disk.total)}`);
  card.querySelector('.uptime').textContent = uptime(data.uptime_seconds);
  const list = card.querySelector('.temps ul');
  if (!data.temperatures.length) {
    const item = document.createElement('li');
    item.textContent = 'NO SENSORS REPORTED';
    list.append(item);
  }
  for (const temp of data.temperatures) {
    const item = document.createElement('li');
    const label = document.createElement('span');
    const value = document.createElement('span');
    label.className = 'temp-label';
    label.textContent = temp.label;
    value.className = 'temp-value ' + (temp.critical !== null && temp.current >= temp.critical ? 'crit' : temp.high !== null && temp.current >= temp.high ? 'warn' : '');
    value.textContent = `${temp.current.toFixed(1)}°C`;
    item.append(label, value);
    list.append(item);
  }
  return card;
}

async function poll() {
  try {
    const response = await fetch('/api/status', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const root = document.getElementById('machines');
    root.replaceChildren(...data.hosts.map(render));
    document.getElementById('count').textContent = `${data.hosts.filter((host) => host.online).length} / ${data.hosts.length} ONLINE`;
    document.getElementById('clock').textContent = `CHECKED ${new Date(data.now).toLocaleTimeString()}`;
  } catch {
    document.getElementById('count').textContent = 'STATUS UNAVAILABLE';
    document.getElementById('clock').textContent = 'RETRYING';
    document.querySelectorAll('.machine').forEach((card) => {
      card.classList.add('unknown');
      card.querySelector('.pill-text').textContent = 'UNKNOWN';
    });
  } finally {
    setTimeout(poll, pollMs);
  }
}
poll();
</script>
</body>
</html>
